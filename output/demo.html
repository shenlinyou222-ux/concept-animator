<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器学习 · 概念动画讲解</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --grey-border: #555555;
    --grey-fill: #1a1a1a;
    --grey-text: #999999;
    --current-fill: #ffffff;
    --current-text: #000000;
    --orange-fill: #ff8c00;
    --orange-text: #000000;
    --temporal-edge: #ff8c00;
    --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
  }

  #app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid #222;
    background: #000;
    z-index: 5;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    white-space: nowrap;
  }
  .controls button {
    background: #111;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .controls button:hover {
    background: #222;
    border-color: #fff;
  }
  .controls .progress-text {
    min-width: 70px;
    text-align: center;
    color: #aaa;
  }
  #progress {
    flex: 1;
    height: 4px;
    background: #222;
    border-radius: 2px;
    overflow: hidden;
    min-width: 120px;
  }
  #progress > div {
    height: 100%;
    width: 0%;
    background: var(--orange-fill);
    transition: width .3s ease;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Upper area: 75% */
  .upper {
    height: 75%;
    display: flex;
    flex-direction: column;
    padding: 12px 20px 6px 20px;
    min-height: 0;
    border-bottom: 1px solid #222;
  }

  .ancestor-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: nowrap;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #222;
    overflow-x: hidden;
    min-height: 48px;
  }
  .ancestor-row .label {
    font-size: 12px;
    color: #777;
    margin-right: 6px;
    white-space: nowrap;
  }

  .node-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--grey-border);
    background: var(--grey-fill);
    color: var(--grey-text);
    font-size: 14px;
    white-space: nowrap;
    transition: all .3s ease;
  }
  .node-pill.current {
    background: var(--current-fill);
    color: var(--current-text);
    border-color: #fff;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 0 24px rgba(255,255,255,.35);
    animation: pulse 2s infinite;
  }
  .node-pill.ancestor {
    opacity: .9;
  }
  .node-pill.ancestor.group-start {
    margin-left: auto;
  }
  .node-pill.entity {
    border-style: solid;
  }
  .node-pill.abstract {
    border-style: dashed;
  }
  .node-pill.clickable {
    cursor: pointer;
  }
  .node-pill.clickable:hover {
    border-color: #ddd;
    color: #fff;
  }
  .node-pill.hidden {
    display: none;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(255,255,255,.18); }
    50% { box-shadow: 0 0 34px rgba(255,255,255,.45); }
  }

  .main-content {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
    margin-top: 8px;
  }

  .lecture {
    flex: 0 0 360px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    overflow-y: auto;
    padding-right: 6px;
  }
  .lecture h2 {
    margin: 0;
    font-size: 24px;
    line-height: 1.3;
    border-left: 4px solid var(--orange-fill);
    padding-left: 10px;
  }
  .lecture .summary {
    color: #ccc;
    font-size: 15px;
    line-height: 1.7;
  }
  .lecture .sentences {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lecture .sentence {
    border-left: 2px solid #333;
    padding-left: 10px;
    color: #eee;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0;
    transform: translateX(-12px);
    animation: slideIn .5s ease forwards;
  }
  .sentence:nth-child(1) { animation-delay: .05s; }
  .sentence:nth-child(2) { animation-delay: .25s; }
  .sentence:nth-child(3) { animation-delay: .45s; }
  .sentence:nth-child(4) { animation-delay: .65s; }
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .contrast-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .contrast-box {
    background: var(--orange-fill);
    color: var(--orange-text);
    border-radius: 6px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
  }
  .contrast-title {
    color: #aaa;
    font-size: 12px;
    margin-bottom: 2px;
  }

  .diagram-wrap {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #040404;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
  }
  #diagram {
    width: 100%;
    height: 100%;
    max-height: 100%;
  }

  /* Lower area: 25% */
  .lower {
    height: 25%;
    display: flex;
    flex-direction: column;
    padding: 8px 20px 12px 20px;
    min-height: 0;
    background: #020202;
  }
  .lower .lower-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 8px;
  }
  .children-row {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .child-box {
    flex: 0 0 auto;
    min-width: 100px;
    max-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--grey-border);
    background: var(--grey-fill);
    color: var(--grey-text);
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
  }
  .child-box.entity {
    border-style: solid;
  }
  .child-box.abstract {
    border-style: dashed;
  }
  .child-box:hover {
    border-color: #ccc;
    color: #fff;
  }
  .child-box .type-tag {
    display: block;
    font-size: 10px;
    color: #777;
    margin-top: 4px;
  }
  .empty {
    color: #666;
    font-size: 14px;
    padding: 10px;
  }

  svg text {
    font-family: var(--font);
  }

  .edge-label {
    font-size: 11px;
    fill: #fff;
  }
  .edge-label.temporal {
    fill: var(--temporal-edge);
  }
  .external-node {
    fill: #181818;
    stroke: #777;
    stroke-width: 1;
  }

  .fade-swap {
    animation: fadeIn .45s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="root-title"></h1>
    <div class="controls">
      <button id="prevBtn" title="上一个节点">◀ 上一步</button>
      <button id="playBtn" title="播放/暂停">▶ 播放</button>
      <button id="nextBtn" title="下一个节点">下一步 ▶</button>
      <span class="progress-text" id="progressText">0 / 0</span>
      <div id="progress"><div id="progressBar"></div></div>
    </div>
  </header>

  <div class="stage">
    <section class="upper" id="upper">
      <div class="ancestor-row" id="ancestorRow"></div>
      <div class="main-content" id="mainContent">
        <div class="lecture" id="lecture"></div>
        <div class="diagram-wrap">
          <svg id="diagram" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
    </section>

    <section class="lower" id="lower">
      <div class="lower-label">子节点 · 仅作结构提示，灰色无额外说明</div>
      <div class="children-row" id="childrenRow"></div>
    </section>
  </div>
</div>

<script>
"use strict";

const TREE = {"id": "机器学习-root", "name": "机器学习", "summary": "让计算机从数据中自动学习规律，而不是由人显式编写全部规则。", "explanation": ["机器学习是让计算机从数据中自动学习规律，而不是由人显式编写所有规则。", "它通常包含数据准备、特征工程、模型训练和评估四个阶段。", "核心对象是数据集、模型、损失函数和优化算法。"], "is_primitive": false, "primitive_kind": null, "contrast": ["传统编程", "显式规则系统"], "set_relations": [{"subject": "机器学习", "relation": "superset_of", "object": "数据集", "note": "机器学习以数据集为输入素材"}, {"subject": "机器学习", "relation": "superset_of", "object": "特征工程", "note": "特征工程是机器学习流程的一部分"}, {"subject": "机器学习", "relation": "superset_of", "object": "模型训练", "note": "模型训练是机器学习的核心阶段"}, {"subject": "机器学习", "relation": "superset_of", "object": "模型评估", "note": "模型评估是机器学习流程的一部分"}], "temporal_relations": [{"before": "特征工程", "after": "模型训练", "kind": "before", "note": "特征工程先于模型训练"}, {"before": "模型训练", "after": "模型评估", "kind": "before", "note": "模型训练得到模型后再评估"}], "spatial_relations": [], "children": [{"id": "数据集-leaf", "name": "数据集", "summary": "由样本组成的集合，每个样本可表示为向量或矩阵。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "特征工程-node", "name": "特征工程", "summary": "把原始数据转换成适合模型学习的特征向量。", "explanation": ["特征工程把原始数据转换成适合模型学习的数值特征。", "常见操作是构造特征向量、处理缺失值、标准化。"], "is_primitive": false, "primitive_kind": null, "contrast": ["手工特征"], "set_relations": [{"subject": "特征向量", "relation": "element_of", "object": "实数向量空间", "note": "特征向量是实数向量空间的元素"}], "temporal_relations": [{"before": "缺失值处理", "after": "标准化", "kind": "before", "note": "先处理缺失值再标准化"}], "spatial_relations": [], "children": [{"id": "特征向量-leaf", "name": "特征向量", "summary": "n 维实数向量，是模型输入的基本数学对象。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "缺失值处理-leaf", "name": "缺失值处理", "summary": "对数据集中空值进行删除或填充，属于集合清洗操作。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "标准化-leaf", "name": "标准化", "summary": "将特征缩放到均值为 0、方差为 1 的实数区间。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}]}, {"id": "模型训练-node", "name": "模型训练", "summary": "通过优化损失函数调整模型参数，使预测误差最小。", "explanation": ["模型训练通过前向传播计算预测，再根据损失函数计算误差。", "梯度下降算法迭代更新参数，逐步降低损失。"], "is_primitive": false, "primitive_kind": null, "contrast": ["推理/预测"], "set_relations": [{"subject": "模型", "relation": "element_of", "object": "函数空间", "note": "模型可看作一个函数"}, {"subject": "损失函数", "relation": "element_of", "object": "函数空间", "note": "损失函数也是函数空间中的元素"}, {"subject": "梯度下降", "relation": "element_of", "object": "优化算法集合", "note": "梯度下降属于迭代优化算法集合"}], "temporal_relations": [{"before": "前向传播", "after": "损失计算", "kind": "before", "note": "先前向传播再计算损失"}, {"before": "损失计算", "after": "梯度计算", "kind": "before", "note": "损失计算后反向传播求梯度"}, {"before": "梯度计算", "after": "参数更新", "kind": "before", "note": "得到梯度后更新参数"}], "spatial_relations": [], "children": [{"id": "模型-leaf", "name": "模型", "summary": "可看作函数 f(x;θ)，将输入向量映射到输出。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "损失函数-leaf", "name": "损失函数", "summary": "评价预测值与真实值差距的数学函数。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "前向传播-leaf", "name": "前向传播", "summary": "按网络结构逐层计算输出。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "损失计算-leaf", "name": "损失计算", "summary": "将预测与标签代入损失函数得到标量误差。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "梯度计算-leaf", "name": "梯度计算", "summary": "计算损失关于参数的导数/偏导数。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "参数更新-leaf", "name": "参数更新", "summary": "用 θ ← θ - η·grad 更新参数向量。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "梯度下降-leaf", "name": "梯度下降", "summary": "一种迭代优化算法，沿负梯度方向更新参数。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": ["随机梯度下降"], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}]}, {"id": "模型评估-node", "name": "模型评估", "summary": "在未见过的测试集上衡量模型泛化能力。", "explanation": ["模型评估使用测试集计算准确率等指标。", "混淆矩阵可以细看每一类别的预测情况。"], "is_primitive": false, "primitive_kind": null, "contrast": ["训练集表现"], "set_relations": [{"subject": "测试集", "relation": "subset_of", "object": "完整数据集", "note": "测试集是从完整数据中划分出的子集"}, {"subject": "准确率", "relation": "element_of", "object": "实数", "note": "准确率是一个 0 到 1 之间的实数"}], "temporal_relations": [{"before": "模型训练", "after": "测试集评估", "kind": "before", "note": "训练完成后才做评估"}], "spatial_relations": [], "children": [{"id": "测试集-leaf", "name": "测试集", "summary": "独立于训练集的样本子集。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "准确率-leaf", "name": "准确率", "summary": "正确预测数 / 样本总数。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}, {"id": "混淆矩阵-leaf", "name": "混淆矩阵", "summary": "行表示真实类别、列表示预测类别的计数矩阵。", "explanation": [], "is_primitive": true, "primitive_kind": "math", "contrast": [], "set_relations": [], "temporal_relations": [], "spatial_relations": [], "children": []}]}]};

const rootTitle = document.getElementById("root-title");
const ancestorRow = document.getElementById("ancestorRow");
const lecture = document.getElementById("lecture");
const childrenRow = document.getElementById("childrenRow");
const diagram = document.getElementById("diagram");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const playBtn = document.getElementById("playBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");
const upper = document.getElementById("upper");
const lower = document.getElementById("lower");

/* ---------- helpers ---------- */

function getNodesInOrder(node) {
  const out = [];
  const stack = [{ n: node, depth: 0 }];
  while (stack.length) {
    const { n, depth } = stack.pop();
    out.push({ id: n.id, depth });
    for (let i = n.children.length - 1; i >= 0; i--) {
      stack.push({ n: n.children[i], depth: depth + 1 });
    }
  }
  return out;
}

const nodeById = new Map();
const order = getNodesInOrder(TREE);
order.forEach(item => {
  const n = findById(TREE, item.id);
  nodeById.set(item.id, n);
});

function findById(node, id) {
  if (node.id === id) return node;
  for (const child of node.children) {
    const hit = findById(child, id);
    if (hit) return hit;
  }
  return null;
}

function getAncestors(root, nodeId) {
  const path = [];
  function visit(n, trail) {
    if (n.id === nodeId) return trail;
    for (const c of n.children) {
      const hit = visit(c, trail.concat(n));
      if (hit) return hit;
    }
    return null;
  }
  return visit(root, []) || [];
}

function makePill(text, className, node) {
  const div = document.createElement("div");
  const entity = node && node.is_primitive;
  div.className = "node-pill " + className + (entity ? " entity" : " abstract") + " clickable";
  div.textContent = text;
  if (node) {
    div.dataset.nodeId = node.id;
    div.addEventListener("click", () => goToId(node.id));
  }
  return div;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = String(text ?? "");
  return div.innerHTML;
}

/* ---------- state ---------- */

let currentIndex = 0;
let playing = false;
let playTimer = null;

function currentNode() {
  return nodeById.get(order[currentIndex].id);
}

function renderCurrent() {
  const node = currentNode();
  if (!node) return;

  // Root title
  rootTitle.textContent = TREE.name + " · 概念动画讲解";

  // Upper: current + ancestors (nearest parent first, root/grandparent at far right)
  ancestorRow.innerHTML = "";
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = "当前讲解:";
  ancestorRow.appendChild(label);

  const ancestors = getAncestors(TREE, node.id);
  ancestorRow.appendChild(makePill(node.name, "current", node));

  if (ancestors.length) {
    const sep = document.createElement("span");
    sep.textContent = "←";
    sep.style.color = "#555";
    ancestorRow.appendChild(sep);
    // Display ancestors from nearest parent to root. The root (for deeper nodes:
    // the parent-of-parent) ends up at the far right, grey, without explanation.
    const ordered = ancestors.slice().reverse(); // [parent, ..., root]
    const pills = [];
    for (let i = 0; i < ordered.length; i++) {
      const pill = makePill(ordered[i].name, i === 0 ? "ancestor group-start" : "ancestor", ordered[i]);
      pills.push(pill);
    }
    pills.forEach(p => ancestorRow.appendChild(p));
  }

  // Lecture panel
  const contrastTitle = node.contrast && node.contrast.length
    ? `<div class="contrast-title">对比概念 · 橙色文本框</div><div class="contrast-list">${node.contrast.map(c => `<span class="contrast-box">${escapeHtml(c)}</span>`).join("")}</div>`
    : "";
  lecture.innerHTML = `
    <h2>${escapeHtml(node.name)}</h2>
    ${node.summary ? `<div class="summary">${escapeHtml(node.summary)}</div>` : ""}
    <div class="sentences">
      ${(node.explanation || []).map(s => `<div class="sentence">${escapeHtml(s)}</div>`).join("")}
    </div>
    ${contrastTitle}
  `;
  // Restart CSS animation by toggling a class.
  lecture.classList.remove("fade-swap");
  void lecture.offsetWidth;
  lecture.classList.add("fade-swap");

  // Lower: child nodes, grey, no extra explanation
  childrenRow.innerHTML = "";
  if (node.children.length === 0) {
    childrenRow.innerHTML = `<div class="empty">已到底层：该节点是数学/物理原语，不再继续展开。${node.is_primitive && node.primitive_kind ? `（${node.primitive_kind === "math" ? "数学抽象" : "物理实体"}）` : ""}</div>`;
  } else {
    for (const child of node.children) {
      const box = document.createElement("div");
      box.className = "child-box " + (child.is_primitive ? "entity" : "abstract");
      box.innerHTML = `${escapeHtml(child.name)}<span class="type-tag">${child.is_primitive ? (child.primitive_kind === "math" ? "数学原语" : "物理实体") : "待展开概念"}</span>`;
      box.dataset.nodeId = child.id;
      box.addEventListener("click", () => goToId(child.id));
      childrenRow.appendChild(box);
    }
  }

  // Relation diagram
  renderDiagram(node);

  // Progress
  progressText.textContent = `${currentIndex + 1} / ${order.length}`;
  progressBar.style.width = ((currentIndex + 1) / order.length * 100).toFixed(1) + "%";
}

/* ---------- SVG relation diagram ---------- */

function renderDiagram(node) {
  diagram.innerHTML = "";
  const W = 1600, H = 800;
  const svg = diagram;
  const children = node.children;

  const byName = new Map();
  const items = [];
  const info = new Map();
  info.set(node.name, { id: node.id, entity: node.is_primitive, external: false });
  for (const child of children) {
    info.set(child.name, { id: child.id, entity: child.is_primitive, external: false });
  }

  function addItem(name, rect) {
    const meta = info.get(name) || { id: null, entity: false, external: true };
    byName.set(name, { rect, id: meta.id, entity: meta.entity });
    items.push({ name, id: meta.id, rect, entity: meta.entity, external: meta.external });
  }

  // ---------- Main area: current node + all direct child nodes ----------
  const currentRect = { x: 40, y: 250, w: 300, h: 300 };
  addItem(node.name, currentRect);

  const gridCols = 3;
  const slotW = 260;
  const slotH = 140;
  const gapX = 25;
  const gapY = 30;
  const gridX = 380;
  const gridY = 30;

  children.forEach((child, i) => {
    const col = i % gridCols;
    const row = Math.floor(i / gridCols);
    addItem(child.name, {
      x: gridX + col * (slotW + gapX),
      y: gridY + row * (slotH + gapY),
      w: slotW - 20,
      h: 110
    });
  });

  // ---------- Spatial relation panel (right side) ----------
  const spatialContainerKinds = new Set([
    "located_in", "inside", "contained_in", "occurs_in", "enters", "generated_in", "within", "in"
  ]);
  const containerOf = new Map();
  const containedBy = new Map();
  const spatialNames = new Set();

  for (const rel of (node.spatial_relations || [])) {
    spatialNames.add(rel.subject);
    spatialNames.add(rel.object);
    if (spatialContainerKinds.has(rel.relation) && rel.subject !== rel.object) {
      containedBy.set(rel.subject, rel.object);
      if (!containerOf.has(rel.object)) containerOf.set(rel.object, []);
      containerOf.get(rel.object).push(rel.subject);
    }
  }

  const spatialInfo = new Map();
  for (const name of spatialNames) {
    spatialInfo.set(name, info.get(name) || { id: null, entity: false, external: true });
  }

  const placedSpatial = new Set();
  const spatialItems = [];

  function placeSpatial(name, x, y, w, h) {
    if (placedSpatial.has(name)) return;
    placedSpatial.add(name);
    const meta = spatialInfo.get(name) || { id: null, entity: false, external: true };
    spatialItems.push({ name, id: meta.id, rect: { x, y, w, h }, entity: meta.entity, external: meta.external });

    const subs = containerOf.get(name) || [];
    const bigSubs = subs.filter(s => containerOf.has(s));
    const smallSubs = subs.filter(s => !containerOf.has(s));

    let cursorY = y + 36;
    let bigCount = 0;
    const bigCols = Math.max(1, Math.floor((w - 20) / 170));
    for (const sub of bigSubs) {
      const bw = Math.min(170, Math.floor((w - 20 - (bigCols - 1) * 12) / bigCols));
      const bh = 120;
      const bx = x + 10 + (bigCount % bigCols) * (bw + 12);
      const by = cursorY;
      placeSpatial(sub, bx, by, bw, bh);
      if ((bigCount + 1) % bigCols === 0) cursorY += bh + 12;
      bigCount++;
    }
    if (bigSubs.length) cursorY += 10;

    const smallCols = Math.max(1, Math.floor((w - 20) / 110));
    const sw = Math.min(100, Math.floor((w - 20 - (smallCols - 1) * 10) / smallCols));
    const sh = 48;
    let smallIdx = 0;
    for (const sub of smallSubs) {
      if (placedSpatial.has(sub)) continue;
      const col = smallIdx % smallCols;
      const row = Math.floor(smallIdx / smallCols);
      const sx = x + 10 + col * (sw + 10);
      const sy = cursorY + row * (sh + 12);
      placeSpatial(sub, sx, sy, sw, sh);
      smallIdx++;
    }
  }

  const panelX = 1180;
  const panelY = 20;
  const panelW = 400;
  const panelH = 760;
  const topContainers = [...containerOf.keys()].filter(name => !containedBy.has(name));
  if (topContainers.length === 0) {
    spatialItems.push({ name: "暂无空间关系", id: null, rect: { x: panelX + 10, y: panelY + 10, w: panelW - 20, h: 100 }, entity: false, external: true });
  } else {
    topContainers.forEach((name, i) => {
      const col = i % 1;
      const row = Math.floor(i / 1);
      placeSpatial(name, panelX + 10, panelY + 10 + row * 400, panelW - 20, 380);
    });
  }

  // ---------- SVG drawing ----------
  function rectSvg(item, fill, stroke, strokeWidth, fontSize, textFill, dash) {
    const rect = item.rect;
    const dashAttr = dash ? ` stroke-dasharray="${dash}"` : "";
    const idAttr = item.id ? ` data-node-id="${escapeHtml(item.id)}"` : "";
    const cursorAttr = item.id ? ` style="cursor:pointer"` : "";
    return `<rect x="${rect.x}" y="${rect.y}" width="${rect.w}" height="${rect.h}" rx="14" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}"${dashAttr}${idAttr}${cursorAttr}/>` +
      `<text x="${rect.x + rect.w / 2}" y="${rect.y + rect.h / 2 + 7}" text-anchor="middle" font-size="${fontSize}" fill="${textFill}">${escapeHtml(item.name)}</text>`;
  }

  function drawItem(item, isCurrent) {
    if (isCurrent) {
      const dash = item.entity ? "" : "7 4";
      return rectSvg(item, "#ffffff", "#ffffff", 3, 24, "#000000", dash);
    }
    if (item.external) {
      return rectSvg(item, "#101010", "#888888", 1.6, 13, "#aaaaaa", "5 4");
    }
    if (item.entity) {
      return rectSvg(item, "#1a1a1a", "#dddddd", 2, 16, "#ffffff", "");
    }
    return rectSvg(item, "#141414", "#888888", 1.8, 16, "#dddddd", "6 4");
  }

  let svgContent = "";
  items.forEach((item, i) => {
    svgContent += drawItem(item, i === 0);
  });

  // Spatial panel frame + title
  svgContent += `<rect x="${panelX}" y="${panelY}" width="${panelW}" height="${panelH}" rx="16" fill="#050505" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  svgContent += `<text x="${panelX + panelW / 2}" y="${panelY + 30}" text-anchor="middle" font-size="18" fill="#ff8c00" font-weight="bold">空间关系配图</text>`;
  spatialItems.forEach(item => {
    svgContent += drawItem(item, false);
  });

  // Temporal edges ONLY: one-directional arrows, no text labels.
  let temporalSvg = "";
  const seenTemporal = new Set();
  for (const rel of (node.temporal_relations || [])) {
    const a = byName.get(rel.before);
    const b = byName.get(rel.after);
    if (!a || !b) continue;
    const key = rel.before + "|" + rel.after;
    if (seenTemporal.has(key)) continue;
    seenTemporal.add(key);
    const p1 = { x: a.rect.x + a.rect.w / 2, y: a.rect.y - 10 };
    const p2 = { x: b.rect.x + b.rect.w / 2, y: b.rect.y - 10 };
    const midX = (p1.x + p2.x) / 2;
    temporalSvg += `<path d="M ${p1.x} ${p1.y} Q ${midX} ${p1.y - 60} ${p2.x} ${p2.y}" fill="none" stroke="#ff8c00" stroke-width="3.5" stroke-dasharray="9 5" marker-end="url(#arrowOrange)"/>`;
  }

  svg.innerHTML = `
    <defs>
      <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8c00"/>
      </marker>
    </defs>
    ${svgContent}${temporalSvg}
  `;

  svg.querySelectorAll("[data-node-id]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      goToId(el.dataset.nodeId);
    });
  });
}

/* ---------- navigation & animation ---------- */

function getIndexById(id) {
  for (let i = 0; i < order.length; i++) {
    if (order[i].id === id) return i;
  }
  return -1;
}

function goToId(id) {
  const idx = getIndexById(id);
  if (idx < 0) return;
  pause();
  goTo(idx);
  const targetHash = "#" + encodeURIComponent(id);
  if (location.hash !== targetHash) {
    try {
      history.replaceState(null, "", targetHash);
    } catch (err) {
      location.hash = targetHash;
    }
  }
}

function goTo(index) {
  currentIndex = (index + order.length) % order.length;
  renderCurrent();
}

function next(step = 1) {
  goTo(currentIndex + step);
}

function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const idx = getIndexById(raw);
  if (idx >= 0 && idx !== currentIndex) {
    goTo(idx);
  }
}

window.addEventListener("hashchange", parseHash);

function play() {
  if (playing) return;
  playing = true;
  playBtn.textContent = "⏸ 暂停";
  playTimer = setInterval(() => {
    if (currentIndex >= order.length - 1) {
      goTo(0);
    } else {
      next(1);
    }
  }, 5000);
}

function pause() {
  playing = false;
  playBtn.textContent = "▶ 播放";
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
}

function togglePlay() {
  if (playing) pause(); else play();
}

prevBtn.addEventListener("click", () => { pause(); next(-1); });
nextBtn.addEventListener("click", () => { pause(); next(1); });
playBtn.addEventListener("click", togglePlay);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { pause(); next(-1); }
  if (e.key === "ArrowRight") { pause(); next(1); }
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

/* ---------- init ---------- */
if (location.hash) {
  const idx = getIndexById(decodeURIComponent(location.hash.replace(/^#\/?/, "")));
  if (idx >= 0) currentIndex = idx;
}
renderCurrent();
</script>
